[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "circuitry"
version = "0.1.0.dev0"
description = "Training-time mechanistic-interpretability diagnostics for PyTorch (LLM / vision / two-tower)."
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Vishwanath Sangale" }]
requires-python = ">=3.10"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "torch>=2.1",
    "numpy>=1.24",
    "tensorboard>=2.14",
]

[project.optional-dependencies]
wandb = ["wandb>=0.16"]
dev = [
    "pytest>=8",
    "pytest-benchmark>=4",
    "import-linter>=2",
    "ruff>=0.4",
]

[project.scripts]
circuitry = "circuitry.cli.main:main"

[project.urls]
Homepage = "https://github.com/vishsangale/circuitry"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-dir]
"" = "src"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]
ignore = ["E501"]
