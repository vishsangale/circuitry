[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "circuitry"
version = "1.3.0"
description = "Mechanistic-interpretability diagnostics for PyTorch — live during training or post-hoc on a checkpoint (LLM / vision / recsys)."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Vishwanath Sangale" }]
requires-python = ">=3.10"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "torch>=2.1",
    "numpy>=1.24",
    "tensorboard>=2.14",
    "sae-lens>=4.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-benchmark>=4",
    "import-linter>=2",
    "ruff==0.15.15",  # pinned: unpinned ruff drifts new lint rules into CI (v1.2.0)
]

[project.scripts]
circuitry = "circuitry.cli.main:main"

[project.urls]
Homepage = "https://github.com/vishsangale/circuitry"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-dir]
"" = "src"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# These tests guard an optional dep with pytest.importorskip(), which must run
# before the dependent imports — so module-level imports legitimately follow it.
"tests/patching/test_atp_qk.py" = ["E402"]
"tests/patching/test_atp_tl.py" = ["E402"]
